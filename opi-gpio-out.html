<script type="text/html" data-template-name="opi_out">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> 名称</label>
        <input type="text" id="node-input-name" placeholder="例如：控制 LED">
    </div>

    <div class="form-row">
        <label for="node-input-select"><i class="fa fa-microchip"></i> 设备型号</label>
        <select id="node-input-select" style="width: 250px;">
            <option value="" disabled>-- 选择设备型号 --</option>
            <option value="opz2w">Orange Pi Zero 2W</option>
        </select>
    </div>

    <div id="opz2w-pin-options" style="display: none;">
        <div class="form-row">
            <label for="node-input-pin-opz2w"><i class="fa fa-tag"></i> GPIO 引脚</label>
            <input type="hidden" id="node-input-pin">
            <select id="node-input-pin-opz2w" style="width: 250px;">
                <option value='' disabled selected style='display:none;'>选择引脚</option>
                <option value="264">PI8 (264)</option>
                <option value="263">PI7 (263)</option>
                <option value="269">PI13 (269)</option>
                <option value="224">PH0 (224)</option>
                <option value="225">PH1 (225)</option>
                <option value="257">PI1 (257)</option>
                <option value="226">PH2 (226)</option>
                <option value="227">PH3 (227)</option>
                <option value="261">PI5 (261)</option>
                <option value="270">PI14 (270)</option>
                <option value="228">PH4 (228)</option>
                <option value="231">PH7 (231)</option>
                <option value="232">PH8 (232)</option>
                <option value="262">PI6 (262)</option>
                <option value="230">PH6 (230)</option>
                <option value="229">PH5 (229)</option>
                <option value="233">PH9 (233)</option>
                <option value="266">PI10 (266)</option>
                <option value="265">PI9 (265)</option>
                <option value="256">PI0 (256)</option>
                <option value="271">PI15 (271)</option>
                <option value="267">PI11 (267)</option>
                <option value="268">PI12 (268)</option>
                <option value="258">PI2 (258)</option>
                <option value="76">PC12 (76)</option>
                <option value="272">PI16 (272)</option>
                <option value="260">PI4 (260)</option>
                <option value="259">PI3 (259)</option>
            </select>
        </div>
    </div>
    <div class="form-row" id="node-set-tick">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-set" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-set" style="width: 70%;">初始化引脚状态?</label>
    </div>
    <div class="form-row" id="node-set-state">
        <label for="node-input-level"><i class="fa fa-level-down"></i> 初始电平</label>
        <select id="node-input-level" style="width: 250px;">
            <option value="0"> 低电平 (0)</option>
            <option value="1"> 高电平 (1)</option>
        </select>
    </div>

</script>

<script type="text/html" data-help-name="opi_out">
    <p>GPIO <b>输出</b> 节点，用于兼容多种设备（当前主要支持 <b>Orange Pi Zero 2W</b>）。</p> <p>
        请先从“设备型号”下拉列表中选择您的设备。根据所选设备，下方会显示可用的 GPIO 引脚列表。</p> <p>选择要控制的 GPIO
        引脚。</p>
    <p>列出的所有 GPIO 引脚都可用，无论其复用功能如何。用户有责任确保不干扰其他引脚功能（例如在别处配置的 I2C, SPI,
        UART）。</p>
    <p>输入的 <code>msg.payload</code> 应设置为 <code>1</code> (高电平) 或 <code>0</code> (低电平) 来控制引脚状态。</p>
    <p><b>初始状态:</b> 您可以选择在部署或启动时初始化引脚的状态。勾选 "初始化引脚状态?" 并选择所需的初始电平 (高或低)。
    </p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('opi_out', {
        category: 'Orange Pi',
        color: '#FFCC66',
        defaults: {
            name: {value: ""},
            select: {value: "opz2w"}, // 重新添加 select, 默认 opz2w
            pin: {value: "", required: true},
            set: {value: false},
            level: {value: "0"}
        },
        inputs: 1,
        outputs: 0,
        icon: "out.png",
        paletteLabel: "GPIO OUT", // 修改标签
        label: function () {
            return this.name || (this.pin ? `${this.select || '设备'} GPIO ${this.pin}` : "GPIO OUT"); // 更新标签显示
        },
        oneditprepare: function () {
            // --- 设备选择变化时，更新引脚UI ---
            const updatePinSelectionUI = () => {
                const selectedDevice = $("#node-input-select").val();
                $("#opz2w-pin-options").hide();
                if (selectedDevice === 'opz2w') {
                    $("#opz2w-pin-options").show();
                }
                // else if ... for future devices
            };

            $("#node-input-select").change(() => {
                updatePinSelectionUI();
            });

            // --- (保持不变) Orange Pi Zero 2W 引脚选择逻辑 ---
            $("#node-input-pin-opz2w").change(function () {
                const selectedOption = $(this).find('option:selected');
                const gpioNumber = selectedOption.val();
                const pinText = selectedOption.text();
                $("#node-input-pin").val(gpioNumber);
                $("#node-input-name").val(pinText);
            });

            // --- (保持不变) 初始状态设置逻辑 ---
            const setstate = function () {
                if ($('#node-input-set').is(":checked")) {
                    $("#node-set-state").show();
                } else {
                    $("#node-set-state").hide();
                }
            };
            $("#node-input-set").change(function () {
                setstate();
            });


            // --- 初始化 ---
            if (this.select) {
                $('#node-input-select').val(this.select);
            } else {
                $('#node-input-select').val('');
            }
            updatePinSelectionUI(); // 初始化引脚UI可见性

            if (this.pin && $("#node-input-select").val() === 'opz2w') {
                $('#node-input-pin-opz2w').val(this.pin);
            }
            // 初始化初始状态设置的可见性
            setstate();
        },
        oneditsave: function () {
            this.select = $("#node-input-select").val();
            if ($("#opz2w-pin-options").is(":visible")) {
                this.pin = $('#node-input-pin-opz2w').val();
                $("#node-input-pin").val(this.pin);
            }
        }
    });
</script>
